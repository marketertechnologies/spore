# spore tmux config for the rocky coordinator host. Scroll + the operator
# workstation theme, plus a context-usage status-right (spore token-status
# --fleet, the ported mcom panel). No other settings.

# Mouse scroll.
set -g mouse on

# Theme (ported from the operator workstation theme.tmux). Colors:
#   accent  #7da36d   ssh #a54242   alert #de935f   bg/fg #000000
set -gq status-interval 5
set -gq status on
set -gq status-style "fg=#000000,bg=#000000,none"
set -gq status-left-style "fg=#000000,bg=#000000"
set -gq status-left-length 150
set -gq status-left "#[fg=#7da36d,bg=#000000,nobold] #S "
set -gq status-right "#(spore token-status --fleet)"
set -gq status-right-length 200
set -gq window-status-format "#[fg=#{?#{m:*!*,#W},#de935f,#{?#{==:#{pane_current_command},ssh},#a54242,#7da36d}},bg=#000000] #I:#W#F "
set -gq window-status-current-format "#[fg=#000000,bg=#{?#{m:*!*,#W},#de935f,#{?#{==:#{pane_current_command},ssh},#a54242,#7da36d}},bold] #I:#W#F "
set -gq window-status-style "fg=#7da36d,bg=#000000,none"
set -gq window-status-last-style "fg=#7da36d,bg=#000000,bold"
set -gq window-status-activity-style "fg=#7da36d,bg=#000000,bold"
set -gq window-status-separator ""
set -gq pane-border-style "fg=#000000,bg=default"
set -gq pane-active-border-style "fg=#7da36d,bg=default"
set -gq display-panes-colour "#000000"
set -gq display-panes-active-colour "#7da36d"
set -gq message-style "fg=#7da36d,bg=#000000"
set -gq message-command-style "fg=#7da36d,bg=#000000"
set -gq mode-style "bg=#7da36d,fg=#000000"

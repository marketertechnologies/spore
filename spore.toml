[coordinator]
# Override the default brief so the spore project's own coordinator does
# not load `bootstrap/coordinator/role.md` -- that file is the
# `BundledCoordinatorRole` asset (`embed.go:60`) shipped to downstream
# consumers and must stay canonical. The dogfood file carries the
# project-specific deltas for spore-as-a-project.
brief = "bootstrap/coordinator/dogfood-role.md"

[fleet]
# Dogfood host runs a max-tier account: workers get the max-tier token
# caps (wrap 180k / force 195k) instead of the safer sub-max defaults.
# Injected into worker sessions as SPORE_ACCOUNT_TIER at spawn.
account_tier = "max"

# Hard gate between engineer and reviewers (docs/role-loop.md "Engineer
# check gate"). Go is only on PATH inside the dev shell. just vuln is
# left out: a stdlib advisory waiting on nixpkgs must not stall loops.
[fleet.roles.engineer]
check = "nix develop -c sh -c 'just fmt-check && just lint && just test'"

# Reviewer A checks the spec and acceptance criteria (fleet review);
# reviewer B hunts bugs with Claude Code's /code-review skill last.
# See docs/role-loop.md.
[fleet.reviewers.A]
mode = "fleet"

[fleet.reviewers.B]
mode = "code-review"
effort = "medium"

[align]
flipped = true

[editor]
# Coordinator connects to the operator's VS Code window (/ide).
auto_connect_ide = true
